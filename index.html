  <script>
    // Apply the visitor's saved theme before anything paints (no flash). Default: dark.
    // Keep in sync with src/hooks/useTheme.js.
    (function () {
      var theme = 'dark';
      try {
        if (localStorage.getItem('theme') === 'light') theme = 'light';
      } catch (e) { /* storage unavailable */ }
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f4ef');
    })();
  </script>
